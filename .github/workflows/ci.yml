name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Scope the concurrency group per ref so a push on one branch only cancels
# in-progress runs of *that same* branch. A single shared group cancelled
# runs from other branches (e.g. dependabot PRs), leaving their checks
# perpetually CANCELLED and the PR status UNSTABLE.
concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:single

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
